[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-cpis-landsat-ssa"
version = "0.1.0"
description = "Landsat-first center pivot detection pipeline for arid SSA"
readme = "README_LANDSAT_SSA.md"
requires-python = ">=3.10"
authors = [{ name = "CPIS Team" }]
dependencies = [
  "earthengine-api>=1.5.9",
  "geopandas>=1.0.1",
  "numpy>=1.26.4",
  "opencv-python>=4.11.0.86",
  "pandas>=2.2.3",
  "pyarrow>=19.0.1",
  "pyproj>=3.7.1",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.6.1",
  "shapely>=2.0.7",
]

[project.scripts]
cpis = "cpis.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

