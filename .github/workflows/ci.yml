name: CI

on:
  push:
    branches: [ main, jan_6_1pm, sample-success, sample-success2 ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy shapely pyproj pyyaml
      - name: Syntax check
        run: |
          python -m py_compile cpis.py
          python -m py_compile src/cpis/cli/main.py
          find src/cpis -name "*.py" -print0 | xargs -0 -I{} python -m py_compile {}
      - name: Run unit tests
        run: pytest -q tests

