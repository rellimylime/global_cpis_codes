# Minimal environment file (from-history style)
# Works across platforms - conda will resolve dependencies for your OS

name: cpi_detection
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.7
  - pytorch=1.6.0
  - torchvision=0.7.0
  - cudatoolkit=10.1
  - gdal=3.2.0
  - pip
  - pip:
    - mmcv-full==1.2.4
    - mmdet==2.7.0
    - shapely==1.7.1
    - earthengine-api
    - geopandas
    - rasterio
